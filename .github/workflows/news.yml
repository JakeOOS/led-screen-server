# Hourly: ask Claude for the one headline worth showing, and publish it as
# news.json on the `data` branch, where the screen fetches it. The branch is a
# single commit that gets replaced, so main's history stays clean.
#
# Needs one repository secret: ANTHROPIC_API_KEY.
name: News

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Fetch the previous story
        run: |
          git fetch -q origin data 2>/dev/null \
            && git show FETCH_HEAD:news.json > prev.json \
            || echo '{}' > prev.json
      - name: Pick a story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/news.py prev.json out/news.json
      - name: Publish to the data branch
        run: |
          if cmp -s prev.json out/news.json; then
            echo "unchanged"; exit 0
          fi
          cd out
          git init -q -b data
          git add news.json
          git -c user.name="voxel-news" -c user.email="actions@users.noreply.github.com" \
            commit -qm "news"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
